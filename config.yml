# CraftEmer settings
# Emerald equipment is intentionally between gold and diamond.

durability: 1000
mining-speed: 9.0
enchantability: 16
repair:
  enabled: true
  amount-per-emerald: 250

combat:
  sword:
    damage: 5.0
    attack-speed: -2.4
  pickaxe:
    damage: 5.0
    attack-speed: -2.8
  axe:
    damage: 7.0
    attack-speed: -3.0
  shovel:
    damage: 3.0
    attack-speed: -3.0
  hoe:
    damage: 0.0
    attack-speed: -2.5

# Embedded resource pack. The ZIP is built from files inside the plugin JAR
# and served by a tiny HTTP server started by CraftEmer.
resource-pack:
  enabled: true
  # Port must be reachable by Minecraft clients from the Internet/LAN.
  port: 8123
  # Public URL that players will use to download the embedded pack.
  # Example: http://YOUR_SERVER_IP:8123/craftemer.zip
  url: ""
  required: false
