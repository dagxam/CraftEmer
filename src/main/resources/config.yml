resource-pack:
  enabled: true
  # URL that Minecraft clients can reach. If left empty, CraftEmer will use server-ip when it is explicitly configured.
  # Example: http://YOUR_PUBLIC_IP:8123/craftemer.zip
  url: ""
  port: 8123
  # Automatically require the pack from players once a reachable URL is available.
  required: true

repair:
  # Durability restored by one emerald in an anvil.
  amount-per-emerald: 250
